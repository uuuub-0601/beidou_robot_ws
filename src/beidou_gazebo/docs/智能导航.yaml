rviz里面的配置：

1.RViz Fixed Frame设置：
Fixed Frame = map

2.Add→ Map（Topic：/map）

3.Add→ RobotModel

4.Add→ MarkerArray（Topic：/elderly_geofence_markers）

5.Add→ Pose（Topic：/elderly_position）

6.Add→ Marker(Topic:/elderly_geofence_status_marker)

